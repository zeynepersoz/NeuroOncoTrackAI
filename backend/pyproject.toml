[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurooncotrack-api"
version = "0.1.0"
description = "NeuroOncoTrack-AI Backend API"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Redis
    "redis[hiredis]>=5.0.0",

    # Security
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",

    # Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "pydantic[email]>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that require live Docker infrastructure",
]
